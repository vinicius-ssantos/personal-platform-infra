name: P1 dogfood image validation (isolated)

on:
  pull_request:
    paths:
      - 'compose/mcp-dev-workspace-dogfood-*.Dockerfile'
      - '.github/workflows/p1-dogfood-image.yml'
      - 'docs/mcp-dev-workspace-dogfood-build.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable PR commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build pinned Java/Python candidate
        run: |
          docker build --pull --platform linux/amd64 \
            -f compose/mcp-dev-workspace-dogfood-base.Dockerfile \
            -t mcp-dev-workspace-dogfood:p1-ci-base .

      - name: Build pinned Node/OpenSpec candidate
        run: |
          docker build --pull --platform linux/amd64 \
            --build-arg BASE_IMAGE=mcp-dev-workspace-dogfood:p1-ci-base \
            -f compose/mcp-dev-workspace-dogfood-full.Dockerfile \
            -t mcp-dev-workspace-dogfood:p1-ci-full .

      - name: Verify non-root, runtimes and OpenSpec without network
        run: |
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 768m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint /bin/sh mcp-dev-workspace-dogfood:p1-ci-full \
            -ec 'test "$(id -u)" = "10001"; java -version; mvn -version; python3 --version; node --version; npm --version; openspec --version'

      - name: Record local image metadata (no publish)
        run: |
          docker image inspect mcp-dev-workspace-dogfood:p1-ci-full \
            --format 'image={{.Id}} user={{.Config.User}}'
          docker history --no-trunc mcp-dev-workspace-dogfood:p1-ci-full | head -25

      - name: Security attestation limits
        run: |
          echo 'Image builds are candidate-only. This job does NOT run vulnerability scanner,'
          echo 'Java integration suite or rollout; these require separate recorded acceptance.'
