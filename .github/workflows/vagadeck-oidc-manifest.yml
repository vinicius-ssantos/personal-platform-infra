name: VagaDeck private OIDC manifest gate

on:
  pull_request:
    paths:
      - 'vagadeck-oidc/**'
      - '.github/workflows/vagadeck-oidc-manifest.yml'
  push:
    branches:
      - main
    paths:
      - 'vagadeck-oidc/**'
      - '.github/workflows/vagadeck-oidc-manifest.yml'

permissions:
  contents: read

jobs:
  private-oidc-manifest:
    # Self-hosted Docker must never execute untrusted fork PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, runner-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout trusted repository code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Validate private-only Docker Compose contract (offline)
        run: python3 -m unittest discover -s vagadeck-oidc -p 'test_*.py' -v
