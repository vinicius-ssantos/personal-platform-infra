# P1 local disposable smoke fixture. Deliberately separate from production Compose.
name: p1-dogfood-validation
services:
  candidate:
    profiles: ["p1-dogfood"]
    image: ${P1_DOGFOOD_IMAGE:-mcp-dev-workspace-dogfood:p1-full-20261127}
    user: "10001:10001"
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - "/tmp:rw,exec,nosuid,size=128m"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'test "$(id -u)" = 10001 && java -version && mvn -version && python3 --version && node --version && npm --version && openspec --version'
